name: process-ips

on:
  schedule:
    # 每 3 小时运行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-ips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 抓取数据并查询 IP 归属地
      - name: Fetch and Process IPv4
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p wetest

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          SOURCE_URL="https://raw.githubusercontent.com/200111226011qw-debug/cf-ip-screener/refs/heads/main/result/clean-ips.txt"

          SOURCE_FILE="$TMP_DIR/clean-ips.txt"
          NEW_V4="$TMP_DIR/ipv4.txt"

          HAS_CHANGES=false

          # 抓取数据源
          echo "正在抓取 Cloudflare IP 数据..."

          curl -fsSL \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: Mozilla/5.0" \
            "$SOURCE_URL" \
            -o "$SOURCE_FILE"

          if [ ! -s "$SOURCE_FILE" ]; then
            echo "错误：数据源为空。"
            exit 1
          fi

          # 解析 IPv4 并查询归属地
          python3 - "$SOURCE_FILE" "$NEW_V4" <<'PY'
          import sys
          import re
          import json
          import time
          import ipaddress
          import urllib.request
          import urllib.error

          source, output_file = sys.argv[1:3]

          ipv4_list = []
          seen = set()

          # 1. 提取 IPv4
          with open(source, "r", encoding="utf-8") as f:
              lines = f.readlines()

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              # 去掉 # 后面的数据中心信息
              address = line.split("#", 1)[0].strip()

              # 兼容 IPv4:端口
              if ":" in address:
                  ip_part, sep, port = address.rpartition(":")

                  if not sep or not port.isdigit():
                      continue

                  address = ip_part.strip()

              try:
                  ip = ipaddress.ip_address(address)

                  # 只保留 IPv4
                  if ip.version != 4:
                      continue

                  ip = str(ip)

                  # 去重，保留原始顺序
                  if ip not in seen:
                      seen.add(ip)
                      ipv4_list.append(ip)

              except ValueError:
                  print(f"跳过无效数据: {line}")

          if not ipv4_list:
              raise SystemExit("错误：没有解析到有效 IPv4，保留原文件。")

          print(f"成功提取 IPv4：{len(ipv4_list)} 条")

          # 2. IP 归属地查询
          API_URL = "http://ip-api.com/batch?fields=status,message,country,query&lang=zh-CN"

          country_map = {}

          # 每批最多 100 个 IP
          batches = [
              ipv4_list[i:i + 100]
              for i in range(0, len(ipv4_list), 100)
          ]

          print(f"需要查询 {len(batches)} 批 IP 归属地")

          for batch_index, batch in enumerate(batches, 1):

              print(
                  f"正在查询第 {batch_index}/{len(batches)} 批，"
                  f"共 {len(batch)} 个 IP..."
              )

              payload = json.dumps(batch).encode("utf-8")

              request = urllib.request.Request(
                  API_URL,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  },
                  method="POST"
              )

              response_data = None

              # 失败时最多重试 3 次
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=60
                      ) as response:
                          response_data = json.loads(
                              response.read().decode("utf-8")
                          )

                      break

                  except urllib.error.HTTPError as e:
                      print(f"API HTTP 错误：{e.code}")

                      if e.code == 429:
                          wait_time = 65
                          print(f"触发限流，等待 {wait_time} 秒后重试...")
                          time.sleep(wait_time)
                          continue

                      raise

                  except Exception as e:
                      print(f"查询失败：{e}")

                      if attempt < 2:
                          time.sleep(10)
                      else:
                          raise

              if response_data is None:
                  raise SystemExit("错误：归属地查询失败，保留原文件。")

              if not isinstance(response_data, list):
                  raise SystemExit("错误：API 返回格式异常。")

              # 解析查询结果
              for item in response_data:
                  if item.get("status") != "success":
                      raise SystemExit(
                          f"IP 查询失败：{item.get('query')} "
                          f"{item.get('message', '')}"
                      )

                  ip = item.get("query")
                  country = item.get("country")

                  if not ip or not country:
                      raise SystemExit(
                          f"错误：IP {ip} 未获得有效归属地。"
                      )

                  country_map[ip] = country

              # IP-API 免费接口限制为每分钟 15 次
              # 每完成 15 批后等待，避免触发限流
              if batch_index % 15 == 0 and batch_index < len(batches):
                  print("已完成 15 次查询，等待 65 秒...")
                  time.sleep(65)

          # 3. 检查查询结果是否完整
          missing = [
              ip for ip in ipv4_list
              if ip not in country_map
          ]

          if missing:
              raise SystemExit(
                  f"错误：有 {len(missing)} 个 IP 未获得归属地，"
                  "保留原文件。"
              )

          # 4. 生成最终文件
          result = []

          for ip in ipv4_list:
              country = country_map[ip]
              result.append(f"{ip}#{country}")

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(result) + "\n")

          print(f"归属地查询完成：{len(result)} 条")
          print("最终输出结果：")
          print("\n".join(result))
          PY

          # 5. 比较新旧文件
          if [ ! -f "wetest/ipv4.txt" ] || \
             ! cmp -s "wetest/ipv4.txt" "$NEW_V4"; then

            cp "$NEW_V4" "wetest/ipv4.txt"
            HAS_CHANGES=true
            echo "IPv4 数据已更新。"
          else
            echo "IPv4 数据没有变化。"
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_ENV"

          echo "IPv4 数据处理完成。"

      # 6. 有变化时提交并推送
      - name: Commit and Push
        if: env.has_changes == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"

          git config --local user.name "github-actions[bot]"

          git add wetest/ipv4.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的变化。"
            exit 0
          fi

          git commit -m "Update IPv4 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}"

          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      # 7. 无变化时跳过提交
      - name: No Changes
        if: env.has_changes == 'false'
        run: echo "IPv4 数据没有变化，跳过提交。"


name: process-ips

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-ips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Process IPv4 & IPv6
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p wetest

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          SOURCE_URL="https://raw.githubusercontent.com/200111226011qw-debug/cf-ip-screener/refs/heads/main/result/clean-ips.txt"

          SOURCE_FILE="$TMP_DIR/clean-ips.txt"
          NEW_V4="$TMP_DIR/ipv4.txt"
          NEW_V6="$TMP_DIR/ipv6.txt"

          HAS_CHANGES=false

          # 1. 抓取数据源
          echo "正在抓取 Cloudflare IP 数据..."

          curl -fsSL \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: Mozilla/5.0" \
            "$SOURCE_URL" \
            -o "$SOURCE_FILE"

          if [ ! -s "$SOURCE_FILE" ]; then
            echo "错误：数据源为空。"
            exit 1
          fi

          # 2. 解析 IPv4 / IPv6
          python3 - "$SOURCE_FILE" "$NEW_V4" "$NEW_V6" <<'PY'
          import sys
          import re
          import ipaddress

          source, output_v4, output_v6 = sys.argv[1:4]

          ipv4_list = []
          ipv6_list = []

          seen_v4 = set()
          seen_v6 = set()

          with open(source, "r", encoding="utf-8") as f:
              lines = f.readlines()

          for line in lines:
              line = line.strip()

              if not line or "#" not in line:
                  continue

              try:
                  # 分离 IP 和数据中心信息
                  address_part, metadata = line.split("#", 1)

                  address_part = address_part.strip()
                  metadata = metadata.strip()

                  if not metadata:
                      continue

                  # 提取 IP，兼容 IPv4:443 和 [IPv6]:443
                  if address_part.startswith("["):
                      match_ip = re.match(
                          r"^\[([^\]]+)\](?::\d+)?$",
                          address_part
                      )

                      if not match_ip:
                          continue

                      address = match_ip.group(1)

                  else:
                      try:
                          ipaddress.ip_address(address_part)
                          address = address_part
                      except ValueError:
                          address, sep, port = address_part.rpartition(":")

                          if not sep or not port.isdigit():
                              continue

                  # 验证 IP 地址
                  ip = ipaddress.ip_address(address)

                  # IPv4
                  if ip.version == 4:
                      value = f"{ip}#{metadata}"

                      if value not in seen_v4:
                          seen_v4.add(value)
                          ipv4_list.append(value)

                  # IPv6
                  elif ip.version == 6:
                      value = f"[{ip}]#{metadata}"

                      if value not in seen_v6:
                          seen_v6.add(value)
                          ipv6_list.append(value)

              except ValueError:
                  print(f"跳过无效数据: {line}")

          # 3. 数据校验
          if not ipv4_list:
              raise SystemExit(
                  "错误：没有解析到有效 IPv4 地址，保留原文件。"
              )

          if not ipv6_list:
              raise SystemExit(
                  "错误：没有解析到有效 IPv6 地址，保留原文件。"
              )

          # 4. 生成文件
          with open(output_v4, "w", encoding="utf-8") as f:
              f.write("\n".join(ipv4_list) + "\n")

          with open(output_v6, "w", encoding="utf-8") as f:
              f.write("\n".join(ipv6_list) + "\n")

          print(f"IPv4 成功解析：{len(ipv4_list)} 条")
          print(f"IPv6 成功解析：{len(ipv6_list)} 条")

          print("IPv4 数据：")
          print("\n".join(ipv4_list))

          print("IPv6 数据：")
          print("\n".join(ipv6_list))
          PY

          # 5. 比较 IPv4
          if [ ! -f "wetest/ipv4.txt" ] || \
             ! cmp -s "wetest/ipv4.txt" "$NEW_V4"; then

            cp "$NEW_V4" "wetest/ipv4.txt"
            HAS_CHANGES=true
            echo "IPv4 数据已更新。"
          else
            echo "IPv4 数据没有变化。"
          fi

          # 6. 比较 IPv6
          if [ ! -f "wetest/ipv6.txt" ] || \
             ! cmp -s "wetest/ipv6.txt" "$NEW_V6"; then

            cp "$NEW_V6" "wetest/ipv6.txt"
            HAS_CHANGES=true
            echo "IPv6 数据已更新。"
          else
            echo "IPv6 数据没有变化。"
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_ENV"

          echo "IPv4 和 IPv6 数据处理完成。"

      # 7. 提交并推送
      - name: Commit and Push
        if: env.has_changes == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"

          git config --local user.name "github-actions[bot]"

          git add wetest/ipv4.txt wetest/ipv6.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的变化。"
            exit 0
          fi

          git commit -m "Update IPv4 & IPv6 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}"

          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      # 8. 无变化跳过提交
      - name: No Changes
        if: env.has_changes == 'false'
        run: echo "IPv4 和 IPv6 均无变化，跳过提交。"

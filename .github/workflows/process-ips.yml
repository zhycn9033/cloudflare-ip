name: process-ips

on:
  schedule:
    # 每 3 小时运行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-ips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 抓取并处理 IPv4
      - name: Fetch and Process IPv4
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p wetest

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          SOURCE_URL="https://raw.githubusercontent.com/200111226011qw-debug/cf-ip-screener/refs/heads/main/result/clean-ips.txt"

          SOURCE_FILE="$TMP_DIR/clean-ips.txt"
          NEW_V4="$TMP_DIR/ipv4.txt"

          HAS_CHANGES=false

          # 抓取数据源
          echo "正在抓取 Cloudflare IP 数据..."

          curl -fsSL \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: Mozilla/5.0" \
            "$SOURCE_URL" \
            -o "$SOURCE_FILE"

          if [ ! -s "$SOURCE_FILE" ]; then
            echo "错误：数据源为空。"
            exit 1
          fi

          # 解析 IPv4，只输出 IP 地址
          python3 - "$SOURCE_FILE" "$NEW_V4" <<'PY'
          import sys
          import ipaddress

          source, output_v4 = sys.argv[1:3]

          ipv4_list = []
          seen_v4 = set()

          with open(source, "r", encoding="utf-8") as f:
              lines = f.readlines()

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              # 去掉 # 后面的数据中心等信息
              address_part = line.split("#", 1)[0].strip()

              # 兼容 IPv4:端口格式
              if ":" in address_part:
                  address, sep, port = address_part.rpartition(":")

                  if not sep or not port.isdigit():
                      continue

                  address_part = address.strip()

              try:
                  ip = ipaddress.ip_address(address_part)

                  # 只保留 IPv4
                  if ip.version != 4:
                      continue

                  value = str(ip)

                  # 去重，保留首次出现顺序
                  if value not in seen_v4:
                      seen_v4.add(value)
                      ipv4_list.append(value)

              except ValueError:
                  print(f"跳过无效数据: {line}")

          # 数据校验：没有有效 IPv4 时不覆盖旧文件
          if not ipv4_list:
              raise SystemExit(
                  "错误：没有解析到有效 IPv4 地址，保留原文件。"
              )

          # 生成文件
          with open(output_v4, "w", encoding="utf-8") as f:
              f.write("\n".join(ipv4_list) + "\n")

          print(f"IPv4 成功解析：{len(ipv4_list)} 条")
          print("IPv4 数据：")
          print("\n".join(ipv4_list))
          PY

          # 3. 比较新旧文件
          if [ ! -f "wetest/ipv4.txt" ] || \
             ! cmp -s "wetest/ipv4.txt" "$NEW_V4"; then

            cp "$NEW_V4" "wetest/ipv4.txt"
            HAS_CHANGES=true
            echo "IPv4 数据已更新。"
          else
            echo "IPv4 数据没有变化。"
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_ENV"

          echo "IPv4 数据处理完成。"

      # 4. 有变化时提交并推送
      - name: Commit and Push
        if: env.has_changes == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --local user.email \
            "github-actions[bot]@users.noreply.github.com"

          git config --local user.name "github-actions[bot]"

          git add wetest/ipv4.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的变化。"
            exit 0
          fi

          git commit -m "Update IPv4 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}"

          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      # 5. 无变化时跳过提交
      - name: No Changes
        if: env.has_changes == 'false'
        run: echo "IPv4 数据没有变化，跳过提交。"
